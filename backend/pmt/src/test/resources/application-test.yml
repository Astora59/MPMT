spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

sql:
  init:
    mode: never
h2:
  console:
    enabled: true   # ✅ Optionnel, pratique pour debug


jwt:
  secret: TestSecretKeyForTestsOnly123456789
  expiration: 3600000